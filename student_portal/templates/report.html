{% extends 'base.html' %}
{% block title %}Report {{ item_type|title }} Item · Campus Lost & Found{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><h1 class="h2">Report a {{ item_type }} item</h1><p class="text-secondary">Add enough detail for others to recognise it. Photos are optional but help matching.</p><form method="post" enctype="multipart/form-data" class="card shadow-sm"><div class="card-body p-4"><div class="row g-3"><div class="col-md-8"><label class="form-label" for="title">Title *</label><input class="form-control" id="title" name="title" maxlength="100" required></div><div class="col-md-4"><label class="form-label" for="category">Category *</label><select class="form-select" id="category" name="category" required><option value="">Choose…</option>{% for category in categories %}<option>{{ category }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="3" maxlength="500"></textarea></div><div class="col-md-6"><label class="form-label" for="location">Location</label><input class="form-control" id="location" name="location" maxlength="100" placeholder="e.g. Main Library"></div><div class="col-md-6"><label class="form-label" for="item_date">Date</label><input class="form-control" type="date" id="item_date" name="item_date" max="{{ today }}"></div><div class="col-12"><label class="form-label" for="photo">Photo (JPG/PNG, max 5 MB)</label><input class="form-control" type="file" accept="image/jpeg,image/png" id="photo" name="photo"></div></div><button class="btn btn-primary mt-4">Submit {{ item_type }} report</button></div></form></div></div>
{% endblock %}
